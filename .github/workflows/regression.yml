name: 每日定时回归

on:
  schedule:
    # 注意：GitHub Actions 的 cron 一律按 UTC 计时，与本地时区无关。
    # 01:17 UTC = 北京时间 09:17。故意避开整点，躲开全球任务高峰。
    - cron: '17 1 * * *'
  # 支持在 Actions 页面手动点按钮触发，方便演示
  workflow_dispatch:
  # 推送到 main 或提 PR 时也跑一次，让回归前移
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  regression:
    name: Web UI 自动化回归
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 确认浏览器版本
        run: google-chrome --version

      # -o 'addopts=' 用于清空 pytest.ini 里为本地环境写死的 --browser=edge，
      # 否则 CI（只有 Chrome）会找不到 Edge 而失败。
      - name: 执行回归（Chrome 无头 + 4 进程并行）
        run: |
          python -m pytest practice/ \
            -o 'addopts=' \
            --browser=chrome \
            --headless \
            -n 4 \
            --html=reports/report.html \
            --self-contained-html

      # if: always() 保证即使上面的用例失败，报告也能拿到，方便定位
      - name: 上传测试报告与失败截图
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: |
            reports/
            latest_logs/
          retention-days: 14
          if-no-files-found: ignore
